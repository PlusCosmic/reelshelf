[package]
name = "reelshelf-monitor"
description = "Reelshelf's monitoring app for the Mac: a Rune window with Reelshelf's ops numbers and Grafana's dashboards drawn natively."
# Its own MAJOR.MINOR, apart from the uploader's: packaging/version.sh adds the patch (commits that touch desktop/), and
# release builds compile the result in through REELSHELF_APP_VERSION (src/links.rs).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "reelshelf-monitor"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
# Reading GitHub's answers for Releases at once.
futures-util.workspace = true
# The uploader's theme (`reelshelf_app::theme`): the site's tokens, its fonts and their mapping onto rune-kit, shared
# rather than copied, so `reelshelf-app`'s tests/theme.rs keeps both apps' colours on the site's.
reelshelf-app = { path = "../app" }
# The Reelshelf API's calls and types, checked against the OpenAPI document by its contract test.
reelshelf-api = { path = "../api" }
reqwest.workspace = true
rune.workspace = true
rune-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

# The Keychain, where the device token and Grafana's token are kept.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
regex.workspace = true
tokio = { workspace = true, features = ["test-util"] }
