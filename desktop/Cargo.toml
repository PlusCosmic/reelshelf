# The Windows uploader in Rust (ADR-0010; build spec in reelshelf-docs/desktop-uploader/README.md). Separate from
# Reelshelf.sln and the Bun workspace, with its own CI job (`Desktop` in .github/workflows/ci.yml).
#
# Members: `core` (reelshelf-core), `api` (reelshelf-api) and `app` (reelshelf-app, the Rune app and its `reelshelf`
# binary).
[workspace]
resolver = "2"
members = ["core", "api", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
bytes = "1.12"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
md-5 = "0.11"
notify = "8"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream", "system-proxy"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
uuid = { version = "1.29.1", features = ["serde", "v4"] }
wiremock = "0.6.5"

# Rune, the app's toolkit, and rune-kit, its components and their token schema, pinned to one `dev` revision and moved
# forward one bump per PR with the headless renders attached. Both name the same revision.
rune = { git = "https://github.com/anomalyco/rune", rev = "cd36f5a9917ec4a65786caf69213c9cc32919984", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "cd36f5a9917ec4a65786caf69213c9cc32919984" }
