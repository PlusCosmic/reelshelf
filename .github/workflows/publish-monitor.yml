name: Publish monitor

# The Mac monitor app (desktop/monitor, desktop/monitor/README.md "Releases"). On pull requests that touch it, it runs
# the monitor's tests and, side by side, builds a universal binary (Apple Silicon + Intel), packages it as
# "Reelshelf Monitor.app" in a disk image and checks the image, publishing nothing. On pushes to main that touch it (or
# by hand) it also publishes the image as a GitHub Release tagged monitor-v<version>. The Linux checks of the whole
# Cargo workspace stay in ci.yml's Desktop job; this workflow is macOS only. Mirrors PlusCosmic/postmaster's macos.yml.

on:
  push:
    branches: [main]
    # What the app is built from: the whole Cargo workspace (the monitor depends on reelshelf-app, reelshelf-api and
    # reelshelf-core) and this workflow. desktop/monitor/packaging/version.sh counts commits on the same paths.
    paths:
      - "desktop/**"
      - ".github/workflows/publish-monitor.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/publish-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two merges in quick succession each get their own release; never cancel a run that may be publishing.
concurrency:
  group: publish-monitor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and the release build compile different profiles, so they run side by side; the release job waits for both.
  test:
    name: Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      # No debug info in CI test builds: far less to write and link.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # rustup reads the channel and components from desktop/rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop

      # The monitor's unit tests and its scenes, rendered on the runner's Metal device, with the Keychain code compiled
      # in (the Desktop job builds it for Linux).
      - name: Test
        run: cargo test --locked -p reelshelf-monitor

  build:
    name: Build and check the disk image
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # The oldest macOS the binary runs on; desktop/monitor/packaging/Info.plist says the same (LSMinimumSystemVersion).
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # With the Developer ID secrets (desktop/monitor/README.md, "Releases") the app is signed with the certificate and
      # the image notarized. Without them, as today, the signature is ad hoc.
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # version.sh counts commits, so it needs the whole history.
          fetch-depth: 0

      # MAJOR.MINOR from desktop/monitor/Cargo.toml, PATCH = commits touching desktop/ (version.sh). The binary
      # (REELSHELF_APP_VERSION, sent as X-Reelshelf-Client: monitor/<version>) and the bundle's Info.plist carry it.
      - name: Compute the version
        id: version
        run: |
          version=$(desktop/monitor/packaging/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MONITOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "REELSHELF_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version: $version"

      # Both architectures, whichever one the runner is.
      - name: Install the Rust toolchain
        working-directory: desktop
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop

      - name: Build release (Apple Silicon + Intel)
        working-directory: desktop
        run: |
          cargo build --locked --release -p reelshelf-monitor \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      # A throwaway keychain holding the certificate; package.sh signs with the identity this names (CODESIGN_IDENTITY).
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          certificate="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm "$certificate"
          # Let codesign use the key without a prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "MACOS_CERTIFICATE_P12 holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Package the app and the disk image
        run: |
          desktop/monitor/packaging/package.sh "$MONITOR_VERSION" dist \
            desktop/target/aarch64-apple-darwin/release/reelshelf-monitor \
            desktop/target/x86_64-apple-darwin/release/reelshelf-monitor
          ls -l dist

      # Apple scans the image and issues a ticket; stapling attaches it, so the image verifies offline. A refusal prints
      # Apple's log of what it found.
      - name: Notarize the disk image
        if: env.SIGNED == 'true'
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          dmg="dist/reelshelf-monitor-$MONITOR_VERSION-macos-universal.dmg"
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$MACOS_NOTARY_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          auth=(--key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID")

          result=$(xcrun notarytool submit "$dmg" "${auth[@]}" \
            --wait --timeout 30m --output-format json)
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}" || true
            echo "Apple did not accept $dmg for notarization" >&2
            exit 1
          fi
          xcrun stapler staple "$dmg"

      # Check what ships, from the image itself: both architectures, an intact signature, the right version in the
      # bundle and the binary, the icon, and a binary that starts on each architecture and draws a fixture scene
      # (headless, on the runner's Metal device, reaching nothing).
      - name: Check the disk image
        run: |
          dmg="dist/reelshelf-monitor-$MONITOR_VERSION-macos-universal.dmg"
          if [ "$SIGNED" = true ]; then
            xcrun stapler validate "$dmg"
          fi
          mount="$RUNNER_TEMP/monitor-image"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force' EXIT
          app="$mount/Reelshelf Monitor.app"
          exe="$app/Contents/MacOS/reelshelf-monitor"

          test -L "$mount/Applications"
          archs=$(lipo -archs "$exe")
          echo "Architectures: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority|Signature|TeamIdentifier|Runtime)' || true
          bundled=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          echo "Bundle version: $bundled"
          [ "$bundled" = "$MONITOR_VERSION" ]
          [ "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = app.reelshelf.monitor ]
          test -s "$app/Contents/Resources/AppIcon.icns"

          # The Intel half runs under Rosetta.
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license
          for a in arm64 x86_64; do
            said=$(arch -$a "$exe" --version)
            echo "$a: $said"
            [ "$said" = "reelshelf-monitor $MONITOR_VERSION" ]
            REELSHELF_MONITOR_FIXTURES=1 REELSHELF_MONITOR_SCENE=overview \
              arch -$a "$exe" --snap "snapshot-$a.png" --theme dark --scale 2 --at 0.5
            test -s "snapshot-$a.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: reelshelf-monitor-macos
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: monitor-snapshot-macos
          path: snapshot-*.png
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [test, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: monitor-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: reelshelf-monitor-macos
          path: dist

      # One release per version, tagged monitor-v<version> at the commit built (publish-release.sh). A run whose version
      # already has a release (a re-run, or a dispatch with no new commit under desktop/) publishes nothing.
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: desktop/monitor/packaging/publish-release.sh "$VERSION" dist/*
