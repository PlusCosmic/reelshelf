name: Publish Application Images

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'frontend/**'
      - 'migrations/**'
      - 'workers/**'
      - 'Dockerfile'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish-app-images.yml'
  workflow_dispatch:
    inputs:
      service:
        description: Service image set to build
        required: true
        default: both
        type: choice
        options:
          - both
          - clips
          - migrations
          - worker

permissions:
  contents: read
  packages: write

# One run at a time, in push order, so an older run can never close a newer run's bump PR and replace it.
# A queued run is superseded by a newer push, which is safe: every run diffs against what is deployed.
concurrency:
  group: publish-app-images
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      clips: ${{ steps.filter.outputs.clips }}
      migrations: ${{ steps.filter.outputs.migrations }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.service }}" in
              both)
                echo "clips=true" >> "$GITHUB_OUTPUT"
                echo "migrations=true" >> "$GITHUB_OUTPUT"
                echo "worker=false" >> "$GITHUB_OUTPUT"
                ;;
              clips)
                echo "clips=true" >> "$GITHUB_OUTPUT"
                echo "migrations=true" >> "$GITHUB_OUTPUT"
                echo "worker=false" >> "$GITHUB_OUTPUT"
                ;;
              migrations)
                echo "clips=false" >> "$GITHUB_OUTPUT"
                echo "migrations=true" >> "$GITHUB_OUTPUT"
                echo "worker=false" >> "$GITHUB_OUTPUT"
                ;;
              worker)
                echo "clips=false" >> "$GITHUB_OUTPUT"
                echo "migrations=false" >> "$GITHUB_OUTPUT"
                echo "worker=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
            exit 0
          fi

          # Diff against the images the infrastructure repo actually deploys, not the previous push. A bump PR
          # can be superseded or closed without merging; diffing push-to-push would then drop its changes,
          # which once left production on app code whose migration never ran.
          compose="$(gh api repos/PlusCosmic/infrastructure/contents/services/clips.yml \
            -H 'Accept: application/vnd.github.raw')"

          # Prints "true" when files matching the pattern changed between the deployed image's commit and this
          # one, or when the deployed commit can't be found here (no tag, or history rewritten). The deployed
          # image is read from the compose text in $3, clips.yml when it is left out.
          needs_build() {
            local image="$1" pattern="$2" text="${3-$compose}" deployed
            deployed="$(grep -oE "ghcr\.io/pluscosmic/${image}:sha-[0-9a-f]{40}" <<< "$text" | head -n 1 | sed 's/.*:sha-//')"
            if [[ -z "$deployed" ]] || ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
              echo "::notice::${image}: deployed commit '${deployed}' not found; building" >&2
              echo true
              return
            fi
            changed="$(git diff --name-only "$deployed" "${{ github.sha }}" | grep -E "$pattern" || true)"
            if [[ -n "$changed" ]]; then
              echo "::notice::${image}: deployed ${deployed:0:7}; changed since: $(tr '\n' ' ' <<< "$changed" | cut -c1-500)" >&2
              echo true
            else
              echo "::notice::${image}: deployed ${deployed:0:7}; nothing relevant changed" >&2
              echo false
            fi
          }

          clips="$(needs_build reelshelf '^(api/|frontend/|migrations/|Dockerfile|package.json|bun.lock|\.github/workflows/publish-app-images\.yml)')"
          migrations="$(needs_build reelshelf-migrations '^(migrations/|package.json|\.github/workflows/publish-app-images\.yml)')"

          # The worker is deployed by its own compose files (services/reelshelf-worker-dev.yml, and one per
          # environment as they are added): every services/*.yml whose image is the worker's, or that hands it to the
          # Batch overflow pool as Overflow__Batch__WorkerImage (services/clips.yml). It needs building
          # when workers/ changed since any of the commits they deploy, or when one can't be found. The bump job
          # rewrites the same set of files.
          worker_needs_build() {
            local files path text found=false result=false
            files="$(gh api repos/PlusCosmic/infrastructure/contents/services \
              --jq '.[] | select(.type == "file" and (.name | endswith(".yml"))) | .path')" || return 1
            while read -r path; do
              [[ -n "$path" ]] || continue
              text="$(gh api "repos/PlusCosmic/infrastructure/contents/${path}" -H 'Accept: application/vnd.github.raw')" || return 1
              grep -qE "(image:[[:space:]]*|Overflow__Batch__WorkerImage=)['\"]?ghcr\.io/pluscosmic/reelshelf-worker:" <<< "$text" || continue
              found=true
              echo "::notice::reelshelf-worker: deployed by ${path}" >&2
              if [[ "$(needs_build reelshelf-worker '^(workers/|\.github/workflows/publish-app-images\.yml)' "$text")" == "true" ]]; then
                result=true
              fi
            done <<< "$files"
            if [[ "$found" != "true" ]]; then
              echo "::notice::reelshelf-worker: no services/*.yml deploys it; building" >&2
              result=true
            fi
            echo "$result"
          }

          worker="$(worker_needs_build)"

          {
            echo "clips=${clips}"
            echo "migrations=${migrations}"
            echo "worker=${worker}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.clips == 'true' || needs.detect.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: clips
            dockerfile: Dockerfile
            image: ghcr.io/pluscosmic/reelshelf
            compose_file: services/clips.yml
            compose_image: clips
          - service: migrations
            dockerfile: migrations/Dockerfile
            image: ghcr.io/pluscosmic/reelshelf-migrations
            compose_file: services/clips.yml
            compose_image: nucleus-migrations
    steps:
      - name: Decide whether to build
        id: should_build
        shell: bash
        run: |
          enabled=false
          if [[ "${{ matrix.service }}" == "clips" && "${{ needs.detect.outputs.clips }}" == "true" ]]; then
            enabled=true
          fi
          if [[ "${{ matrix.service }}" == "migrations" && "${{ needs.detect.outputs.migrations }}" == "true" ]]; then
            enabled=true
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: Checkout app repo
        if: steps.should_build.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.should_build.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.should_build.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.should_build.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The transcode worker's image (workers/Reelshelf.Worker), when detect found workers/ changed since the commit
  # the infrastructure repo's worker compose files deploy.
  worker:
    name: Worker image
    needs: detect
    if: needs.detect.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile fails the build when the image's ffmpeg lacks libsvtav1, libopus or zscale/tonemap.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/Reelshelf.Worker/Dockerfile
          push: true
          tags: |
            ghcr.io/pluscosmic/reelshelf-worker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # One bump PR for every image this run built. As before, the app images are bumped only when build succeeded,
  # and a failed build opens no PR at all. The worker job is skipped when it has nothing to do; it joins the PR
  # when it succeeded, and a failed worker build leaves the worker out without holding back the app images.
  bump-infrastructure:
    needs:
      - detect
      - build
      - worker
    if: >-
      !cancelled()
      && needs.detect.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && (needs.detect.outputs.clips == 'true' || needs.detect.outputs.migrations == 'true' || needs.worker.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: PlusCosmic/infrastructure
          token: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
          path: infrastructure

      - name: Bump compose image tags
        id: bump
        working-directory: infrastructure
        shell: bash
        env:
          SHA: ${{ github.sha }}
          BUMP_CLIPS: ${{ needs.detect.outputs.clips }}
          BUMP_MIGRATIONS: ${{ needs.detect.outputs.migrations }}
          BUMP_WORKER: ${{ needs.detect.outputs.worker == 'true' && needs.worker.result == 'success' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          sha = os.environ["SHA"]
          bumps = []
          bumped = False

          if os.environ["BUMP_CLIPS"] == "true":
              bumps.append(("services/clips.yml", ("clips", "reelshelf"), f"ghcr.io/pluscosmic/reelshelf:sha-{sha}"))

          if os.environ["BUMP_MIGRATIONS"] == "true":
              bumps.append(("services/clips.yml", ("nucleus-migrations", "reelshelf-migrations"), f"ghcr.io/pluscosmic/reelshelf-migrations:sha-{sha}"))

          for compose_file_name, image_names, image in bumps:
              compose_file = Path(compose_file_name)
              text = compose_file.read_text()
              image_pattern = "|".join(re.escape(image_name) for image_name in image_names)
              pattern = re.compile(
                  rf"(image:\s*['\"]?)ghcr\.io/pluscosmic/(?:{image_pattern}):[^'\"\s]+(['\"]?)"
              )
              updated, count = pattern.subn(rf"\1{image}\2", text, count=1)

              if count != 1:
                  raise SystemExit(f"Expected to update one of {image_names} in {compose_file}, updated {count}")

              compose_file.write_text(updated)
              bumped = True

          # The worker: every services/*.yml that deploys it (dev, prod) or names it for the Batch overflow pool
          # (Overflow__Batch__WorkerImage in clips.yml), all of them, skipping the rest.
          if os.environ["BUMP_WORKER"] == "true":
              image = f"ghcr.io/pluscosmic/reelshelf-worker:sha-{sha}"
              pattern = re.compile(
                  r"((?:image:\s*|Overflow__Batch__WorkerImage=)['\"]?)ghcr\.io/pluscosmic/reelshelf-worker:[^'\"\s]+(['\"]?)"
              )
              worker_files = 0
              for compose_file in sorted(Path("services").glob("*.yml")):
                  if not compose_file.is_file():
                      continue
                  text = compose_file.read_text()
                  updated, count = pattern.subn(rf"\1{image}\2", text)
                  if count == 0:
                      continue
                  print(f"Bumping reelshelf-worker in {compose_file} ({count} image line(s))")
                  compose_file.write_text(updated)
                  worker_files += 1
                  bumped = True
              if worker_files == 0:
                  print("::notice::No services/*.yml deploys reelshelf-worker; nothing to bump for it")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"bumped={'true' if bumped else 'false'}\n")
          PY

      # Only when this run has a bump PR to open, so a worker build with no compose file to bump never closes an
      # older PR without replacing it.
      - name: Close previous infrastructure image bump PRs
        if: steps.bump.outputs.bumped == 'true'
        working-directory: infrastructure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
        run: |
          gh pr list \
            --repo PlusCosmic/infrastructure \
            --state open \
            --json number,headRefName,title \
            --jq '.[] | select(.headRefName | startswith("automation/app-images-")) | .number' \
          | while read -r pr_number; do
              [[ -n "$pr_number" ]] || continue
              gh pr close "$pr_number" \
                --repo PlusCosmic/infrastructure \
                --delete-branch \
                --comment "Closing because a newer application image bump PR is being opened."
            done

      - name: Create infrastructure PR
        if: steps.bump.outputs.bumped == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: infrastructure
          token: ${{ secrets.INFRASTRUCTURE_PR_TOKEN }}
          branch: automation/app-images-${{ github.sha }}
          delete-branch: true
          commit-message: Bump app images to sha-${{ github.sha }}
          title: Bump app images to sha-${{ github.sha }}
          body: |
            Updates application image tags for `${{ github.sha }}`.

            Built from `${{ github.repository }}` commit `${{ github.sha }}`.
