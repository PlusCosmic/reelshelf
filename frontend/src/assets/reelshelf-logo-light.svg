    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#211914" flood-opacity="0.18"/>
    </filter>
  </defs>
