      --rs-orange: #c87f3d;
      --rs-black: #211914;
      --rs-paper: #f4eee5;
      --rs-ink: #211914;
      --rs-accent: oklch(0.58 0.09 145);
    }
    .word-main { fill: var(--rs-ink); }
    .word-accent { fill: var(--rs-accent); }
    .card { stroke: var(--rs-paper); stroke-width: 2.4; stroke-linejoin: round; }
  </style>
  <g transform="translate(8 7)" filter="url(#soft-shadow)">
