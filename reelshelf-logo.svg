<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Reelshelf</title>
  <defs>
    <style>
      .tile { fill: #12281e; }
      .book-dark { fill: #317f54; }
      .book-light { fill: #97cca8; }
      .band { fill: #d6ecd8; }
      .shelf { fill: #f6f5ef; }
    </style>
  </defs>
  <rect class="tile" width="512" height="512" rx="44"/>

  <!-- left book -->
  <rect class="book-dark" x="98" y="156" width="92" height="228" rx="12"/>
  <rect class="band" x="98" y="188" width="92" height="8"/>
  <rect class="band" x="98" y="216" width="92" height="8"/>
  <rect class="band" x="98" y="350" width="92" height="8"/>

  <!-- tall middle book -->
  <rect class="book-light" x="206" y="108" width="92" height="276" rx="12"/>
  <rect class="band" x="206" y="140" width="92" height="8"/>
  <rect class="band" x="206" y="168" width="92" height="8"/>
  <rect class="band" x="206" y="350" width="92" height="8"/>

  <!-- leaning book -->
  <g transform="translate(373 271) rotate(-11.3)">
    <rect class="book-dark" x="-40" y="-106" width="80" height="212" rx="12"/>
    <rect class="band" x="-40" y="-70" width="80" height="8"/>
    <rect class="band" x="-40" y="-42" width="80" height="8"/>
  </g>

  <!-- shelf -->
  <rect class="shelf" x="58" y="394" width="394" height="34" rx="17"/>
</svg>
