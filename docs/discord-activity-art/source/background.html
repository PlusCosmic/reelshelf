<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<svg id="s" width="1024" height="576" viewBox="0 0 1024 576">

      <stop offset="0" stop-color="#1a3326"/><stop offset="1" stop-color="#0f1e17"/>
    </radialGradient>
    <!-- Fade the shelves out as they reach toward the middle so the UI has a quiet centre. -->
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="0.17" stop-color="#fff"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.83" stop-color="#fff"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="m"><rect width="1024" height="576" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1024" height="576" fill="url(#glow)"/>
  <g id="art" mask="url(#m)" opacity="0.92"></g>
</svg>
<script src="books.js"></script>
